<!--
============================================================================
  DISCORD EMBED / LINK PREVIEW  (what shows when you paste your link)

  Discord does NOT read the edit box further down — it only reads these
  tags. So if you change your server name, description or member count,
  change it HERE too.

  - og:title        = bold title of the embed
  - og:description  = text under the title
  - og:image        = big picture in the embed (best size: 1200 x 630)
  - theme-color     = the coloured bar on the left of the embed

  Tips:
  - Use a permanent image link (like your GitHub Pages one). Links that
    start with cdn.discordapp.com EXPIRE and the picture will vanish.
  - Discord remembers old embeds for a while. To force a refresh, paste
    your link with ?v=2 on the end (then ?v=3 next time, and so on).
============================================================================
-->

<style>
  :root {
    --bg: #07080F;
    --panel: rgba(14, 15, 28, 0.72);
    --card: #141527;
    --line: rgba(255, 255, 255, 0.08);
    --text: #E7E6EF;
    --muted: #A9A6BE;
    --dim: #8B889F;
    --accent: #6C4CF1;
    --accent-2: #B084FF;
    --blurple: #5865F2;
    --green: #3BA55D;
    --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-display: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  a { color: #B9A6FF; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }
  h1, h2, h3 { font-family: var(--font-display); }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; border-radius: 6px; }

  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--accent), var(--accent-2)); z-index: 50; }
  .page { position: relative; z-index: 1; }
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 32px; }

  /* ---------- Nav ---------- */
  .nav { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid transparent; transition: background .35s, border-color .35s, backdrop-filter .35s; }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; transition: padding .35s var(--ease); }
  .nav.scrolled { background: rgba(7, 8, 15, 0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom-color: var(--line); }
  .nav.scrolled .nav-inner { padding: 12px 0; }
  .brand { display: flex; align-items: center; gap: 12px; color: #fff; }
  .brand-mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; transition: transform .5s var(--ease); }
  .brand:hover .brand-mark { transform: rotate(-8deg) scale(1.08); }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
  .brand-name { font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: -0.2px; }
  .nav-links { display: flex; align-items: center; gap: 34px; }
  .nav-links a { position: relative; font-size: 15px; font-weight: 600; color: #C7C4D9; padding: 6px 0; transition: color .25s; }
  .nav-links a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transform: scaleX(0); transform-origin: 0 50%; transition: transform .35s var(--ease); }
  .nav-links a:hover, .nav-links a.active { color: #fff; }
  .nav-links a:hover::after, .nav-links a.active::after { transform: scaleX(1); }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .burger { display: none; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; padding: 0; position: relative; }
  .burger span { position: absolute; left: 12px; right: 12px; height: 2px; border-radius: 2px; background: #fff; transition: transform .3s var(--ease), opacity .2s, top .3s var(--ease); }
  .burger span:nth-child(1) { top: 14px; } .burger span:nth-child(2) { top: 20px; } .burger span:nth-child(3) { top: 26px; }
  .burger[aria-expanded="true"] span:nth-child(1) { top: 20px; transform: rotate(45deg); }
  .burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .burger[aria-expanded="true"] span:nth-child(3) { top: 20px; transform: rotate(-45deg); }
  .mobile-menu { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); background: rgba(7, 8, 15, 0.95); }
  .mobile-menu > div { overflow: hidden; }
  .mobile-menu.open { grid-template-rows: 1fr; border-bottom: 1px solid var(--line); }
  .mobile-menu a.m-link { display: block; padding: 14px 0; font-size: 16px; font-weight: 700; color: #E7E6EF; border-top: 1px solid var(--line); }
  .mobile-menu .btn { margin: 14px 0 20px; width: 100%; justify-content: center; }

  /* ---------- Buttons ---------- */
  .btn { position: relative; display: inline-flex; align-items: center; gap: 10px; border-radius: 12px; font-weight: 700; overflow: hidden; transition: transform .3s var(--ease), box-shadow .3s, background .3s, border-color .3s; will-change: transform; }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn-primary { background: var(--blurple); color: #fff; box-shadow: 0 8px 24px rgba(88,101,242,.45); }
  .btn-primary:hover { box-shadow: 0 14px 36px rgba(88,101,242,.6); color: #fff; }
  .btn-primary::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; transform: skewX(-20deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transition: left .7s var(--ease); }
  .btn-primary:hover::after { left: 130%; }
  .btn-ghost { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: var(--text); }
  .btn-ghost:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.28); color: #fff; }
  .btn-ghost .arrow { display: inline-block; transition: transform .3s var(--ease); }
  .btn-ghost:hover .arrow { transform: translateY(3px); }
  .btn-sm { padding: 11px 20px; font-size: 15px; }
  .btn-lg { padding: 16px 30px; font-size: 16px; }
  .btn-xl { padding: 18px 38px; font-size: 17px; }
  .btn-pulse { animation: pulse 2.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 8px 24px rgba(88,101,242,.45), 0 0 0 0 rgba(88,101,242,.55); } 70%, 100% { box-shadow: 0 8px 24px rgba(88,101,242,.45), 0 0 0 18px rgba(88,101,242,0); } }

  /* ---------- Hero ---------- */
  .hero { position: relative; text-align: center; padding: 110px 0 90px; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; opacity: .55; }
  .orb-1 { width: 620px; height: 420px; top: -160px; left: 50%; margin-left: -310px; background: radial-gradient(circle, var(--accent), transparent 70%); animation: drift 14s ease-in-out infinite alternate; }
  .orb-2 { width: 380px; height: 380px; top: 120px; left: -120px; background: radial-gradient(circle, var(--blurple), transparent 70%); opacity: .3; animation: drift 18s ease-in-out infinite alternate-reverse; }
  .orb-3 { width: 340px; height: 340px; top: 220px; right: -120px; background: radial-gradient(circle, var(--accent-2), transparent 70%); opacity: .28; animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate3d(-30px, -10px, 0) scale(1); } to { transform: translate3d(40px, 30px, 0) scale(1.12); } }

  .rise { opacity: 0; animation: rise .9s var(--ease) forwards; animation-delay: var(--d, 0ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

  .badge { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; background: rgba(88,101,242,.12); border: 1px solid rgba(88,101,242,.35); margin-bottom: 28px; font-size: 14px; font-weight: 700; color: #C6C2FF; }
  .dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .dot::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--green); animation: ping 1.8s ease-out infinite; }
  @keyframes ping { to { transform: scale(3.2); opacity: 0; } }

  .hero h1 { position: relative; margin: 0 auto 24px; font-size: clamp(40px, 7.4vw, 72px); font-weight: 800; line-height: 1.05; letter-spacing: -1.5px; max-width: 900px; color: #fff; }
  .grad { background: linear-gradient(110deg, #8C7BFF, var(--blurple), var(--accent-2), #8C7BFF); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 7s linear infinite; }
  @keyframes sheen { to { background-position: -300% 0; } }
  .hero p.lead { position: relative; margin: 0 auto 40px; font-size: clamp(17px, 2.2vw, 19px); line-height: 1.6; max-width: 620px; color: var(--muted); }
  .hero-cta { position: relative; display: flex; gap: 16px; margin-bottom: 64px; flex-wrap: wrap; justify-content: center; }

  .stats { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 760px; margin: 0 auto; padding-top: 36px; border-top: 1px solid var(--line); }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; border-radius: 14px; transition: transform .35s var(--ease), background .35s; }
  .stat:hover { transform: translateY(-4px); background: rgba(255,255,255,.04); }
  .stat b { font-family: var(--font-display); font-size: 30px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--dim); font-weight: 600; }

  /* ---------- Marquee ---------- */
  .marquee { overflow: hidden; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02); -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .marquee-track { display: flex; width: max-content; animation: scroll 32s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  .marquee-item { display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; font-family: var(--font-display); font-size: 15px; font-weight: 700; color: #C7C4D9; white-space: nowrap; }
  .marquee-item::after { content: '✦'; color: var(--accent-2); font-size: 12px; }
  @keyframes scroll { to { transform: translateX(-50%); } }

  /* ---------- Sections ---------- */
  .section { padding: 100px 0; }
  .section.alt { background: var(--panel); }
  .section-head { text-align: center; max-width: 640px; margin: 0 auto 60px; }
  .eyebrow { font-size: 14px; font-weight: 700; color: #8C7BFF; letter-spacing: 1.5px; text-transform: uppercase; }
  .section-head h2, .community h2 { margin: 14px 0 0; font-size: clamp(30px, 4.4vw, 40px); font-weight: 800; letter-spacing: -0.5px; color: #fff; line-height: 1.15; }

  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s var(--ease), transform .8s var(--ease); transition-delay: var(--d, 0ms); }
  .reveal.from-left { transform: translateX(-40px); }
  .reveal.from-right { transform: translateX(40px); }
  .reveal.in { opacity: 1; transform: none; }

  /* ---------- Feature cards ---------- */
  .features-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  .card { position: relative; padding: 32px; border-radius: 18px; background: var(--card); border: 1px solid rgba(255,255,255,.06); display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
  .card { transition: opacity .8s var(--ease) var(--d, 0ms), transform .8s var(--ease) var(--d, 0ms), translate .45s var(--ease), border-color .4s, box-shadow .4s; }
  .card.in:hover { translate: 0 -8px; border-color: color-mix(in srgb, var(--accent-2) 45%, transparent); box-shadow: 0 24px 50px rgba(0,0,0,.4); }
  .card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--accent) 28%, transparent), transparent 65%); opacity: 0; transition: opacity .4s; pointer-events: none; }
  .card:hover::before { opacity: 1; }
  .card > * { position: relative; }
  .icon-box { width: 48px; height: 48px; border-radius: 12px; background: rgba(88,101,242,.15); display: flex; align-items: center; justify-content: center; transition: transform .5s var(--ease), background .4s; }
  .card:hover .icon-box { transform: scale(1.12) rotate(-6deg); background: rgba(88,101,242,.28); }
  .card h3 { margin: 0; font-size: 19px; font-weight: 700; color: #fff; }
  .card p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); }

  /* ---------- Community ---------- */
  .community { display: flex; align-items: center; gap: 80px; }
  .community-text { flex: 1; display: flex; flex-direction: column; gap: 24px; }
  .community-text p.intro { margin: 0; font-size: 16px; line-height: 1.7; color: var(--muted); max-width: 480px; }
  .benefits { display: flex; flex-direction: column; gap: 20px; margin-top: 8px; }
  .benefit { display: flex; gap: 14px; align-items: flex-start; }
  .check { width: 32px; height: 32px; border-radius: 8px; background: rgba(59,165,93,.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .check polyline { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .6s var(--ease); transition-delay: calc(var(--d, 0ms) + 350ms); }
  .benefit.in .check polyline { stroke-dashoffset: 0; }
  .benefit-title { font-size: 16px; font-weight: 700; color: #fff; }
  .benefit-desc { font-size: 14px; color: var(--dim); margin-top: 2px; line-height: 1.5; }

  .preview-wrap { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1000px; }
  .preview-float { width: 100%; max-width: 460px; animation: float 7s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .preview { position: relative; border-radius: 20px; background: var(--card); border: 1px solid var(--line); padding: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 80px color-mix(in srgb, var(--accent) 18%, transparent); transition: transform .25s ease-out; transform-style: preserve-3d; }
  .preview-head { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .avatar { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); overflow: hidden; flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .preview-name { font-size: 15px; font-weight: 700; color: #fff; }
  .preview-count { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--green); font-weight: 600; margin-top: 2px; }
  .channels { display: flex; flex-direction: column; gap: 8px; }
  .channel { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; background: rgba(255,255,255,.04); font-size: 14px; color: #C7C4D9; transition: background .5s, color .5s, transform .5s var(--ease); }
  .channel .hash { color: #6B6880; font-size: 16px; transition: color .5s; }
  .channel.active { background: rgba(88,101,242,.22); color: #fff; transform: translateX(6px); }
  .channel.active .hash { color: #B9A6FF; }
  .eq { margin-left: auto; display: flex; align-items: flex-end; gap: 3px; height: 14px; }
  .eq i { width: 3px; height: 100%; border-radius: 2px; background: var(--green); transform-origin: 50% 100%; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.35s; } .eq i:nth-child(3) { animation-delay: -.7s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
  .typing { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--dim); }
  .typing-dots { display: inline-flex; gap: 4px; }
  .typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: #8B889F; animation: bounce 1.2s ease-in-out infinite; }
  .typing-dots i:nth-child(2) { animation-delay: .15s; } .typing-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

  /* ---------- Intro screen ---------- */
  #intro { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg); transition: opacity .6s var(--ease), visibility .6s; }
  #intro.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #intro .intro-mark { width: 84px; height: 84px; border-radius: 24px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 60px color-mix(in srgb, var(--accent) 55%, transparent); animation: introPop .7s var(--ease) both; }
  #intro .intro-mark img { width: 100%; height: 100%; object-fit: cover; }
  #intro .intro-name { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.3px; animation: rise .6s var(--ease) .2s both; }
  #intro .intro-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; animation: rise .6s var(--ease) .3s both; }
  #intro .intro-bar i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); animation: introBar .9s var(--ease) .25s both; }
  @keyframes introPop { from { transform: scale(.6) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes introBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  body.intro-hold .rise { animation-play-state: paused; }

  /* ---------- Hero banner ---------- */
  .hero-banner { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s var(--ease); pointer-events: none; }
  .hero-banner.show { opacity: .28; }
  .hero-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,8,15,.55), rgba(7,8,15,.35) 50%, var(--bg)); }
  .hero-banner-blur { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(30px) saturate(1.3); opacity: 0; transition: opacity 1.2s var(--ease); pointer-events: none; }
  .hero-banner-blur.show { opacity: .35; }
  .badge .sep { opacity: .4; }
  .badge .online { color: #7EE0A0; }

  /* ---------- Gallery ---------- */
  .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .gallery-grid.n1 { grid-template-columns: 1fr; max-width: 820px; margin: 0 auto; }
  .gallery-grid.n3, .gallery-grid.n5, .gallery-grid.n6 { grid-template-columns: repeat(3, 1fr); }
  .shot { position: relative; margin: 0; border-radius: 18px; overflow: hidden; background: var(--card); border: 1px solid rgba(255,255,255,.06); aspect-ratio: 16 / 10; cursor: zoom-in; transition: opacity .9s var(--ease) var(--d, 0ms), transform .9s var(--ease) var(--d, 0ms), border-color .4s, box-shadow .4s; }
  .shot.in { transform: none; }
  .shot:hover { border-color: color-mix(in srgb, var(--accent-2) 45%, transparent); box-shadow: 0 24px 50px rgba(0,0,0,.45); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; filter: blur(14px) saturate(.6); transform: scale(1.08); transition: filter 1.1s var(--ease) calc(var(--d, 0ms) + 200ms), transform 1.1s var(--ease) calc(var(--d, 0ms) + 200ms); }
  .shot.in img { filter: none; transform: scale(1); }
  .shot:hover img { transform: scale(1.04); transition-delay: 0s; transition-duration: .6s; }
  .shot figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 18px 16px; font-size: 14px; font-weight: 600; color: #fff; background: linear-gradient(180deg, transparent, rgba(7,8,15,.9)); transform: translateY(8px); opacity: 0; transition: transform .4s var(--ease), opacity .4s; }
  .shot.in figcaption { transform: none; opacity: 1; }

                <div class="preview-name">${esc(c.serverName)}</div>
                <div class="preview-count"><span class="dot"></span><span id="previewOnline">${esc(c.onlineCount || '0')}</span> Online &nbsp;·&nbsp; <span id="previewMembers">${esc(c.memberCount)}</span> Members</div>
              </div>
            </div>
            <div class="channels">
              ${c.previewChannels.map(ch => `<div class="channel text"><span class="hash">#</span><span>${esc(ch)}</span></div>`).join('')}
              <div class="channel">${svg('voice', 14, '#6B6880')}<span>${esc(c.previewVoiceChannel)}</span><span class="eq"><i></i><i></i><i></i></span></div>
            </div>
            <div class="typing"><span class="typing-dots"><i></i><i></i><i></i></span><span>Several people are typing…</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  ${gallery.length ? `
  <section id="gallery" class="section alt">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="eyebrow">Screenshots</span>
        <h2>${esc(c.galleryTitle || 'A peek inside')}</h2>
      </div>
      <div class="gallery-grid n${gallery.length}" id="galleryGrid">
        ${gallery.map((g, i) => `
          <figure class="shot reveal" style="--d:${(i % 3) * 120}ms" data-full="${esc(g.image)}" data-caption="${esc(g.caption || '')}">
            <img src="${esc(g.image)}" alt="${esc(g.caption || 'Server screenshot')}" loading="lazy">
            ${g.caption ? `<figcaption>${esc(g.caption)}</figcaption>` : ''}
          </figure>
        `).join('')}
      </div>
    </div>
  </section>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot"><img alt=""><figcaption></figcaption></div>
  ` : ''}

  ${rules.length ? `
  <section id="rules" class="section${gallery.length ? '' : ' alt'}">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="eyebrow">House rules</span>
        <h2>Server rules</h2>
        ${c.rulesIntro ? `<p style="margin:14px 0 0;color:var(--muted);font-size:16px">${esc(c.rulesIntro)}</p>` : ''}
      </div>
      <div class="rules-grid">
        ${rules.map((r, i) => `
          <div class="rule reveal" style="--d:${(i % 2) * 120}ms">
            <div class="rule-num">${String(i + 1).padStart(2, '0')}</div>
            <div><h3>${esc(r.title)}</h3><p>${esc(r.description || '')}</p></div>
          </div>
        `).join('')}
      </div>
      <p class="rules-note reveal">Breaking the rules can lead to a warning, mute, kick, or ban depending on how serious it is. Staff decisions are final.</p>
    </div>
  </section>
  ` : ''}

  <section id="faq" class="section${(gallery.length && rules.length) || (!gallery.length && !rules.length) ? ' alt' : ''}">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="eyebrow">Good to know</span>
        <h2>Frequently asked questions</h2>
      </div>
      <div class="faq-list">
        ${c.faqs.map((f, i) => `
          <div class="faq-item reveal${i === 0 ? ' open' : ''}" style="--d:${i * 80}ms">
            <button class="faq-q" aria-expanded="${i === 0}" aria-controls="faq-a-${i}">
              <span>${esc(f.question)}</span><span class="faq-icon"></span>
            </button>
            <div class="faq-a" id="faq-a-${i}"><div><p>${esc(f.answer)}</p></div></div>
          </div>
        `).join('')}
      </div>
    </div>
  </section>

  <section class="cta">
    <div class="orb"></div><div class="orb b"></div>
    <div class="wrap">
      <h2 class="reveal">Ready to jump in?</h2>
      <p class="reveal" style="--d:100ms">Join ${esc(String(c.memberCount).replace(/\+$/, ''))}+ members already hanging out in ${esc(c.serverName)}.</p>
      <div class="reveal" style="--d:200ms">${joinBtn('Join ' + c.serverName + ' on Discord', 'btn-xl btn-pulse')}</div>
    </div>
  </section>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>© ${esc(c.establishedYear)}–${new Date().getFullYear()} ${esc(c.serverName)}. ${esc(c.footerNote)}</span>
      <div class="footer-links">
        <a href="${rules.length ? '#rules' : '#faq'}">Rules</a>
        <a href="#faq">Support</a>
        <a href="${esc(c.inviteLink)}" target="_blank" rel="noopener">Join Server</a>
      </div>
    </div>
  </footer>
`;

/* ============================ Animations ============================ */

// Intro screen: hold the hero animations until the logo intro is done
(function intro() {
  const el = document.getElementById('intro');
  if (!el) return;
  const finish = () => {
    el.classList.add('done');
    document.body.classList.remove('intro-hold');
    try { sessionStorage.setItem('introSeen', '1'); } catch (e) {}
    setTimeout(() => el.remove(), 800);
  };
  setTimeout(finish, 1250);
  window.addEventListener('load', () => setTimeout(finish, 900), { once: true });
})();

// Banner behind the hero (from the edit box, or from Discord below)
function setBanner(url) {
  if (!url) return;
  const img = new Image();
  img.onload = () => {
    ['heroBanner', 'heroBannerBlur'].forEach(id => { const e = document.getElementById(id); e.style.backgroundImage = `url("${url}")`; e.classList.add('show'); });
  };
  img.src = url;
}
setBanner(c.bannerImage);

// Live member / online counts straight from the Discord invite
(function liveStats() {
  if (!c.liveStats) return;
  const code = (String(c.inviteLink).match(/(?:discord\.gg\/|discord(?:app)?\.com\/invite\/)([\w-]+)/) || [])[1];
  if (!code) return;
  const fmt = n => Number(n).toLocaleString('en-US');
  const setText = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  const setStat = (id, n) => {
    const e = document.getElementById(id); if (!e) return;
    const from = parseInt(e.textContent.replace(/\D/g, ''), 10) || 0, to = Number(n);
    if (reduced || from === to) { e.textContent = fmt(to); return; }
    const start = performance.now(), dur = 1200;
    (function tick(now) {
      const t = Math.min(1, (now - start) / dur);
      e.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3))));
      if (t < 1) requestAnimationFrame(tick);
    })(start);
  };
  fetch(`https://discord.com/api/v10/invites/${code}?with_counts=true&with_expiration=true`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const g = d.guild || {};
      const members = d.approximate_member_count, online = d.approximate_presence_count;
      if (members != null) {
        // Wait for the intro count-up to finish before switching to live numbers
        setTimeout(() => {
          setStat('statMembers', members); setStat('statOnline', online || 0);
          setText('previewMembers', fmt(members)); setText('previewOnline', fmt(online || 0));
          document.getElementById('heroBadge').innerHTML = `<span class="online">${fmt(online || 0)} online</span><span class="sep"> · </span>${fmt(members)} members`;
          document.querySelectorAll('.cta p').forEach(p => p.textContent = `Join ${fmt(members)} members already hanging out in ${c.serverName}.`);
        }, 2600);
      }
      if (g.id && g.icon && !c.logoImage) {
        const ext = g.icon.startsWith('a_') ? 'gif' : 'png';
        const url = `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.${ext}?size=256`;
        document.querySelectorAll('.brand-mark, .avatar, .intro-mark').forEach(el => { el.innerHTML = `<img src="${url}" alt="">`; });
        document.getElementById('favicon').href = url;
      }
      if (g.id && g.banner && !c.bannerImage) {
        setBanner(`https://cdn.discordapp.com/banners/${g.id}/${g.banner}.${g.banner.startsWith('a_') ? 'gif' : 'png'}?size=1024`);
      } else if (g.id && g.splash && !c.bannerImage) {
        setBanner(`https://cdn.discordapp.com/splashes/${g.id}/${g.splash}.png?size=1024`);
      }
    })
    .catch(() => { /* Discord unreachable or invite expired — the numbers from the edit box stay */ });
})();

// Gallery: hide broken images, open a lightbox on click
(function galleryFx() {
  const grid = document.getElementById('galleryGrid'), lb = document.getElementById('lightbox');
  if (!grid) return;
  const section = document.getElementById('gallery');
  const refit = () => {
    const n = grid.querySelectorAll('.shot').length;
    grid.className = 'gallery-grid n' + n;
    if (!n) { section.remove(); lb.remove(); }
  };
  grid.querySelectorAll('img').forEach(img => {
    img.addEventListener('error', () => {
      const shot = img.closest('.shot');
      shot.classList.add('missing');
      shot.innerHTML = `<div class="shot-empty">${svg('events', 28, '#8C7BFF')}<b>Screenshot coming soon</b><span>Upload <code>${esc(shot.dataset.full)}</code> to your repo and it will appear here.</span></div>`;
    });
  });
  const lbImg = lb.querySelector('img'), lbCap = lb.querySelector('figcaption');
  grid.addEventListener('click', e => {
    const shot = e.target.closest('.shot'); if (!shot || shot.classList.contains('missing')) return;
    lbImg.src = shot.dataset.full; lbCap.textContent = shot.dataset.caption; lb.classList.add('open');
  });
  const close = () => lb.classList.remove('open');
  lb.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();

// Fade / slide sections in as you scroll to them
(function reveal() {
  const els = document.querySelectorAll('.reveal');
  if (reduced || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  els.forEach(e => io.observe(e));
})();

// Count the stats up from zero
(function countUp() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const m = el.textContent.trim().match(/^(\d[\d,]*)(.*)$/);
    if (!m || reduced) return;
    const target = parseInt(m[1].replace(/,/g, ''), 10), suffix = m[2], commas = m[1].includes(',');
    const fmt = n => (commas ? n.toLocaleString('en-US') : String(n)) + suffix;
    el.textContent = fmt(0);
    const start = performance.now() + (document.getElementById('intro') ? 1700 : 900), dur = 1600;
    (function tick(now) {
      const t = Math.min(1, Math.max(0, (now - start) / dur));
      el.textContent = fmt(Math.round(target * (1 - Math.pow(1 - t, 4))));
      if (t < 1) requestAnimationFrame(tick);
    })(performance.now());
  });
})();

// Nav: shrink on scroll, progress bar, highlight current section, mobile menu
(function nav() {
  const navEl = document.getElementById('nav'), bar = document.getElementById('progress');
  const burger = document.getElementById('burger'), menu = document.getElementById('mobileMenu');
  let ticking = false;
  function onScroll() {
    const y = window.scrollY, max = document.documentElement.scrollHeight - window.innerHeight;
    navEl.classList.toggle('scrolled', y > 12);
    bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0) + ')';
    ticking = false;
  }
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  onScroll();

  function setMenu(open) {
    menu.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  burger.addEventListener('click', () => setMenu(!menu.classList.contains('open')));
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setMenu(false)));

  const links = [...document.querySelectorAll('.nav-links a')].filter(a => a.getAttribute('href').startsWith('#'));
  if ('IntersectionObserver' in window && links.length) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id));
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    links.forEach(a => { const s = document.getElementById(a.getAttribute('href').slice(1)); if (s) io.observe(s); });
  }
})();

// FAQ accordion
document.querySelectorAll('.faq-item').forEach(item => {
  item.querySelector('.faq-q').addEventListener('click', () => {
    const open = !item.classList.contains('open');
    document.querySelectorAll('.faq-item.open').forEach(o => { o.classList.remove('open'); o.querySelector('.faq-q').setAttribute('aria-expanded', 'false'); });
    item.classList.toggle('open', open);
    item.querySelector('.faq-q').setAttribute('aria-expanded', String(open));
  });
});

// Glow that follows the mouse on feature cards
if (canHover) {
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
}

// Server preview: 3D tilt + cycling "active" channel
(function preview() {
  const wrap = document.getElementById('previewWrap'), card = document.getElementById('preview');
  if (fx.cardTilt && canHover && !reduced) {
    wrap.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = `rotateY(${x * 12}deg) rotateX(${-y * 12}deg)`;
    });
    wrap.addEventListener('pointerleave', () => { card.style.transform = ''; });
  }
  const chans = card.querySelectorAll('.channel.text');
  if (!chans.length) return;
  let i = Math.min(1, chans.length - 1);
  chans[i].classList.add('active');
  if (reduced || chans.length < 2) return;
  setInterval(() => {
    chans[i].classList.remove('active');
    i = (i + 1) % chans.length;
    chans[i].classList.add('active');
  }, 2600);
})();

// Twinkling starfield with the odd shooting star
(function starfield() {
  const cv = document.getElementById('stars');
  if (!fx.starfield) { cv.remove(); return; }
  const ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = 0, h = 0, stars = [], shoot = null, nextShoot = 3000, running = true;

  function resize(force) {
    const nw = window.innerWidth, nh = window.innerHeight;
    if (!force && nw === w && Math.abs(nh - h) < 160) return; // ignore mobile address-bar wobble
    w = nw; h = nh + 160;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(180, Math.floor(w * h / 8500));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.3 + 0.3,
      p: Math.random() * 6.28, s: Math.random() * 0.9 + 0.3, tint: Math.random() < 0.28
    }));
    if (reduced) draw(0);
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    const sy = window.scrollY;
    for (const s of stars) {
      let y = (s.y - sy * s.r * 0.06) % h; if (y < 0) y += h;
      ctx.globalAlpha = reduced ? 0.6 : 0.25 + 0.75 * Math.abs(Math.sin(s.p + t * 0.001 * s.s));
      ctx.fillStyle = s.tint ? '#B9A6FF' : '#FFFFFF';
      ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.2832); ctx.fill();
    }
    if (fx.shootingStars && !reduced) {
      if (!shoot && t > nextShoot) {
        shoot = { x: Math.random() * w * 0.8 + w * 0.1, y: Math.random() * h * 0.35, life: 0 };
      }
      if (shoot) {
        shoot.life += 0.022; shoot.x += 9; shoot.y += 4.5;
        const a = Math.sin(Math.min(1, shoot.life) * Math.PI);
        const g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - 130, shoot.y - 65);
        g.addColorStop(0, 'rgba(255,255,255,' + a + ')'); g.addColorStop(1, 'rgba(185,166,255,0)');
        ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - 130, shoot.y - 65); ctx.stroke();
        if (shoot.life >= 1) { shoot = null; nextShoot = t + 4000 + Math.random() * 6000; }
      }
    }
    ctx.globalAlpha = 1;
    if (!reduced && running) requestAnimationFrame(draw);
  }

  resize(true);
  window.addEventListener('resize', () => resize(false));
  document.addEventListener('visibilitychange', () => {
    const was = running; running = !document.hidden;
    if (running && !was && !reduced) requestAnimationFrame(draw);
  });
  if (!reduced) requestAnimationFrame(draw);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra Lounge — Discord Community</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #0B0C14; }
  a { color: #B9A6FF; text-decoration: none; }
  a:hover { color: #D6C9FF; }
  ::selection { background: #6C4CF1; color: #fff; }
  @media (max-width: 900px) {
    .nav-links { display: none !important; }
    .hero-title { font-size: 44px !important; }
    .features-grid { grid-template-columns: 1fr !important; }
    .community-row { flex-direction: column !important; }
    .stats-row { flex-wrap: wrap; gap: 28px !important; }
    section, .section-pad { padding-left: 24px !important; padding-right: 24px !important; }
  }
</style>
</head>
<body>

<!--
============================================================================
  EDIT EVERYTHING IN THIS BOX. Nothing below this script needs to be
  touched — the page builds itself from these values.

  - Plain text fields: just replace the text between the quotes.
  - Lists (features / benefits / faq): copy an existing { ... } block,
    paste it above the closing ], and edit its text. Delete a block to
    remove that card. Keep the commas between blocks.
  - "icon" on a feature can be any one of: voice, events, shield, roles,
    bots, support  (these are ready-made icon drawings below).
============================================================================
-->
<script>
const CONFIG = {
  serverName: "Astra Lounge",
  inviteLink: "https://discord.gg/tEQhbRVXx8",

  memberCount: "150",
  channelCount: "20",
  establishedYear: "2028",

  heroBadge: "150 members and growing",
  heroDescription: "A chill place to hang out, talk, and game with people who get it.",

  navLinks: [
    { label: "Features", href: "#features" },
    { label: "Community", href: "#community" },
    { label: "FAQ", href: "#faq" }
  ],

  features: [
    { icon: "voice", title: "Active Voice Channels", description: "Hangout lounges, game rooms, and study halls that are almost always live." },
    { icon: "events", title: "Weekly Events", description: "Game nights, movie nights, giveaways, and tournaments every week." },
    { icon: "shield", title: "Friendly, Moderated Space", description: "Clear rules and a quick-to-respond mod team keep things welcoming." },
    { icon: "roles", title: "Custom Roles & Badges", description: "Unlock roles as you get more active and involved in the community." },
    { icon: "bots", title: "Bots & Mini-games", description: "Leveling, music, trivia, and economy games to keep things fun." },
    { icon: "support", title: "Real Support, Real People", description: "A dedicated support channel staffed by people who actually reply." }
  ],

  niche: "gamers, chatters, and anyone looking for a good hangout",
  audienceIntro: "Astra Lounge is for anyone who wants a friendly place to talk, play, and make new friends online.",

  benefits: [
    { title: "Make real friends", description: "People stick around — conversations turn into real friendships." },
    { title: "Grow together", description: "Level up, join events, and get more involved as you go." },
    { title: "Never miss an event", description: "Event pings and a shared calendar keep everyone in the loop." }
  ],

  previewChannels: ["welcome", "general-chat", "events"],
  previewVoiceChannel: "Voice Lounge 1",

  faqs: [
    { question: "Is this server free to join?", answer: "Yes — joining Astra Lounge is completely free." },
    { question: "Do I need to verify to join?", answer: "Just accept the rules on entry — no extra verification needed." },
    { question: "What are the community rules?", answer: "Be respectful, no spam, and keep things friendly. Full rules are pinned in the server." },
    { question: "How do I get support?", answer: "Ping a mod in #support or open a ticket — we respond quickly." }
  ],

  footerNote: "Not affiliated with Discord Inc."
};
</script>
<!-- ==================== DO NOT EDIT BELOW THIS LINE ==================== -->

<div id="app"></div>

<script>
const ICONS = {
  voice: '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>',
  events: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  shield: '<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>',
  roles: '<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  bots: '<rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><line x1="12" y1="7" x2="12" y2="11"/>',
  support: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  discord: '<path d="M17 8c0-3.3-2.2-6-5-6S7 4.7 7 8c-3 1-5 4-5 8 0 3.3 4 5 10 5s10-1.7 10-5c0-4-2-7-5-8z"/>',
  check: '<polyline points="20 6 9 17 4 12"/>'
};

function svg(iconKey, size, stroke, fillDots) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[iconKey] || ''}${fillDots ? '<circle cx="9" cy="12" r="1" fill="'+stroke+'"/><circle cx="15" cy="12" r="1" fill="'+stroke+'"/>' : ''}</svg>`;
}

function joinBtn(label, extraStyle) {
  return `<a href="${CONFIG.inviteLink}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 10px; border-radius: 12px; background: #5865F2; color: #fff; font-weight: 700; box-shadow: 0 8px 24px rgba(88,101,242,0.45); ${extraStyle}">${svg('discord', 20, '#fff')}${label}</a>`;
}

const c = CONFIG;

document.getElementById('app').innerHTML = `
<div style="width: 100%; box-sizing: border-box; background: #0B0C14; color: #E7E6EF; display: flex; flex-direction: column;">

  <div class="section-pad" style="position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 20px 64px; background: rgba(11,12,20,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #6C4CF1, #B084FF); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        ${svg('discord', 22, '#fff', true)}
      </div>
      <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.2px; color: #fff;">${c.serverName}</span>
    </div>
    <div class="nav-links" style="display: flex; align-items: center; gap: 36px;">
      ${c.navLinks.map(l => `<a href="${l.href}" style="font-size: 15px; font-weight: 600; color: #C7C4D9;">${l.label}</a>`).join('')}
    </div>
    ${joinBtn('Join Server', 'padding: 11px 22px; font-size: 15px;')}
  </div>

  <div class="section-pad" style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 120px 64px 100px; overflow: hidden;">
    <div style="position: absolute; top: -180px; left: 50%; transform: translateX(-50%); width: 900px; height: 500px; background: radial-gradient(circle, rgba(108,76,241,0.35), transparent 70%); filter: blur(40px); pointer-events: none;"></div>

    <div style="position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; background: rgba(88,101,242,0.12); border: 1px solid rgba(88,101,242,0.35); margin-bottom: 28px;">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #3BA55D; box-shadow: 0 0 8px #3BA55D;"></span>
      <span style="font-size: 14px; font-weight: 700; color: #C6C2FF;">${c.heroBadge}</span>
    </div>

    <h1 class="hero-title" style="position: relative; margin: 0 0 24px; font-size: 68px; font-weight: 800; line-height: 1.05; letter-spacing: -1.5px; max-width: 900px; color: #fff;">
      Welcome to <span style="background: linear-gradient(135deg, #8C7BFF, #5865F2); -webkit-background-clip: text; background-clip: text; color: transparent;">${c.serverName}</span>
    </h1>

    <p style="position: relative; margin: 0 0 40px; font-size: 19px; line-height: 1.6; max-width: 620px; color: #A9A6BE;">${c.heroDescription}</p>

    <div style="position: relative; display: flex; gap: 16px; margin-bottom: 64px; flex-wrap: wrap; justify-content: center;">
      ${joinBtn('Join Our Discord', 'padding: 16px 32px; font-size: 16px;')}
      <a href="#features" style="display: inline-flex; align-items: center; gap: 8px; padding: 16px 28px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #E7E6EF; font-weight: 700; font-size: 16px;">See what's inside</a>
    </div>

    <div class="stats-row" style="position: relative; display: flex; gap: 56px; padding-top: 40px; border-top: 1px solid rgba(255,255,255,0.08); width: 100%; max-width: 720px; justify-content: center;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-size: 30px; font-weight: 800; color: #fff;">${c.memberCount}</span>
        <span style="font-size: 13px; color: #8B889F; font-weight: 600;">Members</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-size: 30px; font-weight: 800; color: #fff;">${c.channelCount}+</span>
        <span style="font-size: 13px; color: #8B889F; font-weight: 600;">Channels</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-size: 30px; font-weight: 800; color: #fff;">24/7</span>
        <span style="font-size: 13px; color: #8B889F; font-weight: 600;">Active Moderation</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-size: 30px; font-weight: 800; color: #fff;">${c.establishedYear}</span>
        <span style="font-size: 13px; color: #8B889F; font-weight: 600;">Established</span>
      </div>
    </div>
  </div>

  <div id="features" class="section-pad" style="padding: 100px 64px; background: #0F1018;">
    <div style="text-align: center; max-width: 640px; margin: 0 auto 64px;">
      <span style="font-size: 14px; font-weight: 700; color: #8C7BFF; letter-spacing: 1.5px; text-transform: uppercase;">What you'll find</span>
      <h2 style="margin: 14px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -0.5px; color: #fff;">Everything a great community needs</h2>
    </div>
    <div class="features-grid" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;">
      ${c.features.map(f => `
        <div style="padding: 32px; border-radius: 18px; background: #171826; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 16px;">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(88,101,242,0.15); display: flex; align-items: center; justify-content: center;">
            ${svg(f.icon, 24, '#8C7BFF')}
          </div>
          <h3 style="margin: 0; font-size: 19px; font-weight: 700; color: #fff;">${f.title}</h3>
          <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #A9A6BE;">${f.description}</p>
        </div>
      `).join('')}
    </div>
  </div>

  <div id="community" class="community-row section-pad" style="padding: 100px 64px; background: #0B0C14; display: flex; align-items: center; gap: 80px;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 28px;">
      <span style="font-size: 14px; font-weight: 700; color: #8C7BFF; letter-spacing: 1.5px; text-transform: uppercase;">Who it's for</span>
      <h2 style="margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -0.5px; color: #fff; line-height: 1.2;">Built for ${c.niche}</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #A9A6BE; max-width: 480px;">${c.audienceIntro}</p>
      <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 12px;">
        ${c.benefits.map(b => `
          <div style="display: flex; gap: 14px; align-items: flex-start;">
            <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(59,165,93,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              ${svg('check', 16, '#3BA55D')}
            </div>
            <div>
              <div style="font-size: 16px; font-weight: 700; color: #fff;">${b.title}</div>
              <div style="font-size: 14px; color: #8B889F;">${b.description}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
      <div style="width: 100%; max-width: 460px; border-radius: 20px; background: #171826; border: 1px solid rgba(255,255,255,0.08); padding: 28px; box-shadow: 0 24px 60px rgba(0,0,0,0.35);">
        <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #6C4CF1, #B084FF);"></div>
          <div>
            <div style="font-size: 15px; font-weight: 700; color: #fff;">${c.serverName}</div>
            <div style="font-size: 13px; color: #3BA55D; font-weight: 600;">● ${c.memberCount} Members</div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          ${c.previewChannels.map(ch => `
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.04);">
              <span style="color: #6B6880; font-size: 16px;">#</span>
              <span style="font-size: 14px; color: #C7C4D9;">${ch}</span>
            </div>
          `).join('')}
          <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.04);">
            ${svg('voice', 14, '#6B6880')}
            <span style="font-size: 14px; color: #C7C4D9;">${c.previewVoiceChannel}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="faq" class="section-pad" style="padding: 100px 64px; background: #0F1018;">
    <div style="text-align: center; max-width: 640px; margin: 0 auto 56px;">
      <span style="font-size: 14px; font-weight: 700; color: #8C7BFF; letter-spacing: 1.5px; text-transform: uppercase;">Good to know</span>
      <h2 style="margin: 14px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -0.5px; color: #fff;">Frequently asked questions</h2>
    </div>
    <div style="max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;">
      ${c.faqs.map(f => `
        <div style="padding: 24px 28px; border-radius: 14px; background: #171826; border: 1px solid rgba(255,255,255,0.06);">
          <div style="font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px;">${f.question}</div>
          <div style="font-size: 15px; line-height: 1.6; color: #A9A6BE;">${f.answer}</div>
        </div>
      `).join('')}
    </div>
  </div>

  <div class="section-pad" style="padding: 90px 64px; background: linear-gradient(135deg, #241C4E, #171029); text-align: center; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -120px; right: -80px; width: 500px; height: 400px; background: radial-gradient(circle, rgba(108,76,241,0.4), transparent 70%); filter: blur(30px);"></div>
    <h2 style="position: relative; margin: 0 0 16px; font-size: 42px; font-weight: 800; color: #fff; letter-spacing: -0.5px;">Ready to jump in?</h2>
    <p style="position: relative; margin: 0 0 36px; font-size: 17px; color: #C7C4D9;">Join ${c.memberCount}+ members already hanging out in ${c.serverName}.</p>
    ${joinBtn('Join ' + c.serverName + ' on Discord', 'position: relative; padding: 18px 40px; font-size: 17px; box-shadow: 0 10px 30px rgba(88,101,242,0.5);')}
  </div>

  <div class="section-pad" style="padding: 40px 64px; background: #0B0C14; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
    <span style="font-size: 14px; color: #6B6880;">© ${c.establishedYear}–now ${c.serverName}. ${c.footerNote}</span>
    <div style="display: flex; gap: 24px;">
      <a href="#faq" style="font-size: 14px; color: #8B889F; font-weight: 600;">Rules</a>
      <a href="#faq" style="font-size: 14px; color: #8B889F; font-weight: 600;">Support</a>
      <a href="${c.inviteLink}" target="_blank" rel="noopener" style="font-size: 14px; color: #8B889F; font-weight: 600;">Join Server</a>
    </div>
  </div>

</div>
`;
</script>
</body>
</html>
